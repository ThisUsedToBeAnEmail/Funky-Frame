  <!-- Mock fetch for API calls in test sandbox -->
  <script>
  (function() {
    'use strict';
    var originalFetch = window.fetch;

    // Default mock responses for common API endpoints
    var mockResponses = {
      '/api/saved_filters': { data: [], success: true },
      '/api/preferences': { data: {}, success: true },
      '/api/user': { data: { id: 1, name: 'Test User' }, success: true }
    };

    window.fetch = function(url, options) {
      // Check if this is an API call we should mock
      var urlStr = typeof url === 'string' ? url : url.toString();
      var isApiCall = urlStr.indexOf('/api/') !== -1;

      if (isApiCall) {
        // Find matching mock response
        var mockKey = Object.keys(mockResponses).find(function(key) {
          return urlStr.indexOf(key) !== -1;
        });

        if (mockKey) {
          // Return mock response
          return Promise.resolve(new Response(JSON.stringify(mockResponses[mockKey]), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          }));
        }

        // For unmocked API calls, return empty success response
        console.log('[Test Sandbox] Mocking unmapped API call:', urlStr);
        return Promise.resolve(new Response(JSON.stringify({ data: [], success: true }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        }));
      }

      // Pass through non-API calls (assets, etc.)
      return originalFetch.apply(this, arguments);
    };

    // Allow tests to add custom mock responses
    window.FUNKY_TEST_MOCKS = {
      addResponse: function(url, response) {
        mockResponses[url] = response;
      },
      clearResponses: function() {
        mockResponses = {
          '/api/saved_filters': { data: [], success: true },
          '/api/preferences': { data: {}, success: true },
          '/api/user': { data: { id: 1, name: 'Test User' }, success: true }
        };
      },
      getOriginalFetch: function() {
        return originalFetch;
      }
    };
  })();
  </script>

  <script>
  (function() {
    'use strict';

    // Debug: Check if test framework loaded - log to parent window too
    var frameworkLoaded = typeof FunkyTests !== 'undefined';
    var describeLoaded = typeof describe !== 'undefined';
    console.log('[Sandbox] FunkyTests available:', frameworkLoaded);
    console.log('[Sandbox] describe available:', describeLoaded);

    // Also send to parent for visibility
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(JSON.stringify({
        action: 'debug',
        data: {
          funkyTestsLoaded: frameworkLoaded,
          describeLoaded: describeLoaded
        }
      }), window.location.origin);
    }

    var statusEl = document.getElementById('sandboxStatus');
    var parentOrigin = window.location.origin;
    var testsLoaded = false;
    var testsRunning = false;

    /**
     * Send message to parent window
     */
    function sendToParent(action, data) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({
          action: action,
          data: data
        }), parentOrigin);
      }
    }

    /**
     * Serialize a value for postMessage (handles non-cloneable values)
     */
    function serializeValue(value) {
      if (value === undefined) {
        return { type: 'undefined' };
      }
      if (value === null) {
        return { type: 'null', value: null };
      }
      if (typeof value === 'function') {
        return { type: 'function', name: value.name || 'anonymous' };
      }
      if (value instanceof Element) {
        return {
          type: 'element',
          tag: value.tagName.toLowerCase(),
          id: value.id || null,
          classes: value.className || null
        };
      }
      if (value instanceof RegExp) {
        return { type: 'regex', value: value.toString() };
      }
      if (value instanceof Error) {
        return { type: 'error', message: value.message, name: value.name };
      }
      if (typeof value === 'symbol') {
        return { type: 'symbol', value: value.toString() };
      }
      // Try to serialize as JSON (handles primitives, arrays, plain objects)
      try {
        var json = JSON.stringify(value);
        // Check if it's a simple value or can be parsed back
        if (json !== undefined) {
          return { type: 'value', value: JSON.parse(json) };
        }
      } catch (e) {
        // JSON serialization failed, return string representation
      }
      // Fallback: return string representation
      try {
        return { type: 'object', value: String(value) };
      } catch (e) {
        // Object cannot be converted to string (e.g., null prototype objects)
        return { type: 'object', value: '[Object: cannot stringify]' };
      }
    }

    /**
     * Convert error to string message
     */
    function errorToString(err) {
      if (!err) return 'Unknown error';
      if (typeof err === 'string') return err;
      if (err.message) return err.message;
      if (err.name) return err.name;
      try {
        var str = JSON.stringify(err);
        return str !== '{}' ? str : String(err);
      } catch (e) {
        return String(err);
      }
    }

    /**
     * Check if error should be silenced (expected in sandbox)
     */
    function isExpectedSandboxError(msg) {
      if (!msg) return false;

      // Clipboard errors are expected in sandboxed iframes
      if (msg.indexOf('Copy command failed') !== -1 ||
          msg.indexOf('clipboard') !== -1 ||
          msg.indexOf('Clipboard') !== -1) {
        return true;
      }

      // API test errors (intentional 4xx/5xx responses in tests)
      if (msg.indexOf('"success":false') !== -1 ||
          msg.indexOf('"status":4') !== -1 ||
          msg.indexOf('"status":5') !== -1) {
        return true;
      }

      // Component cleanup errors during tests (accessing destroyed elements)
      if (msg.indexOf('contentWindow') !== -1 ||
          msg.indexOf("reading 'el'") !== -1 ||
          msg.indexOf('Cannot read properties of null') !== -1 ||
          msg.indexOf('Cannot read properties of undefined') !== -1) {
        return true;
      }

      // User-initiated abort errors (from stop button)
      if (msg.indexOf('aborted by user') !== -1) {
        return true;
      }

      return false;
    }

    // Catch unhandled promise rejections
    window.addEventListener('unhandledrejection', function(event) {
      var message = errorToString(event.reason);
      // Silence expected sandbox errors
      if (isExpectedSandboxError(message)) {
        event.preventDefault();
        return;
      }
      console.error('[Sandbox] Unhandled rejection:', event.reason);
      sendToParent('error', { message: message });
    });

    // Catch uncaught errors
    window.addEventListener('error', function(event) {
      var message = event.error ? event.error.message : event.message;
      // Silence expected sandbox errors
      if (isExpectedSandboxError(message)) {
        event.preventDefault();
        return;
      }
      console.error('[Sandbox] Uncaught error:', event.error);
      sendToParent('error', { message: message || 'Unknown error' });
    });

    /**
     * Update status display
     */
    function updateStatus(text) {
      if (statusEl) {
        statusEl.textContent = text;
      }
    }

    /**
     * Serialize suites for postMessage (removes circular references)
     * Extracts nested suites from tests array into children array
     */
    function serializeSuites(suites) {
      return suites.map(function(suite) {
        var tests = [];
        var children = [];

        // Separate tests from nested suites
        (suite.tests || []).forEach(function(item) {
          if (item.type === 'suite' && item.suite) {
            // Nested suite - add to children
            children.push(item.suite);
          } else {
            // Regular test - include skip status
            tests.push({
              type: item.type,
              name: item.name,
              skip: item.skip || false
            });
          }
        });

        return {
          name: suite.name,
          tests: tests,
          children: children.length > 0 ? serializeSuites(children) : [],
          skip: suite.skip || false  // Include suite skip status
        };
      });
    }

    /**
     * Load test files dynamically
     */
    function loadTestFiles(files) {
      return new Promise(function(resolve) {
        if (!files || files.length === 0) {
          resolve();
          return;
        }

        var loaded = 0;
        var total = files.length;

        function loadNext(index) {
          if (index >= files.length) {
            resolve();
            return;
          }

          var file = files[index];
          var script = document.createElement('script');
          script.src = file;

          script.onload = function() {
            loaded++;
            updateStatus('Loading tests: ' + loaded + '/' + total);
            sendToParent('loadProgress', { loaded: loaded, total: total });
            loadNext(index + 1);
          };

          script.onerror = function() {
            console.warn('[Sandbox] Failed to load:', file);
            loaded++;
            loadNext(index + 1);
          };

          document.body.appendChild(script);
        }

        loadNext(0);
      });
    }

    /**
     * Configure test framework for sandbox environment
     */
    function configureTestEnvironment() {
      // Set reasonable timeout for complex E2E tests
      if (typeof FunkyTests !== 'undefined') {
        FunkyTests.configure({ timeout: 10000 });
      }

      // Configure E2E utilities with reasonable timeouts
      if (typeof FunkyTests !== 'undefined' && FunkyTests.E2E) {
        FunkyTests.E2E.configure({
          defaultTimeout: 5000,
          retryInterval: 50
        });
      }
    }

    /**
     * Setup reporter to forward events to parent
     */
    function setupReporter() {
      if (typeof FunkyTests === 'undefined') {
        console.error('[Sandbox] FunkyTests not found');
        sendToParent('error', { message: 'FunkyTests not found' });
        return;
      }

      configureTestEnvironment();

      FunkyTests.setReporter({
        start: function() {
          sendToParent('testsStart', {});
        },

        suiteStart: function(suite, indent) {
          sendToParent('suiteStart', {
            name: suite.name,
            indent: indent
          });
        },

        suiteEnd: function(suite, indent) {
          sendToParent('suiteEnd', {
            name: suite.name,
            indent: indent
          });
        },

        testStart: function(test, suite, indent) {
          sendToParent('testStart', {
            name: test.name,
            suite: suite.name,
            indent: indent
          });
        },

        testPass: function(test, duration, indent) {
          sendToParent('testPass', {
            name: test.name,
            duration: duration,
            indent: indent
          });
        },

        testFail: function(test, error, duration, indent) {
          sendToParent('testFail', {
            name: test.name,
            duration: duration,
            indent: indent,
            error: {
              message: error ? error.message : 'Unknown error',
              stack: error ? error.stack : ''
            }
          });
        },

        testSkip: function(test, indent) {
          sendToParent('testSkip', {
            name: test.name,
            indent: indent
          });
        },

        testComplete: function(test, result, indent) {
          // Serialize assertion results for postMessage
          var serializedAssertions = (result.assertions || []).map(function(a) {
            return {
              type: a.type,
              passed: a.passed,
              actual: serializeValue(a.actual),
              expected: serializeValue(a.expected),
              message: a.message,
              negated: a.negated
            };
          });

          sendToParent('testComplete', {
            name: test.name,
            passed: result.passed,
            duration: result.duration,
            assertions: serializedAssertions,
            source: result.source,
            error: result.error ? {
              message: result.error.message,
              stack: result.error.stack
            } : null
          });
        },

        end: function(results) {
          testsRunning = false; // Allow running again
          sendToParent('testsEnd', {
            passed: results.passed,
            failed: results.failed,
            skipped: results.skipped,
            total: results.total,
            startTime: results.startTime,
            endTime: results.endTime
          });
        }
      });
    }

    /**
     * Run tests with optional filter
     */
    function runTests(filter) {
      updateStatus('Running tests...');

      var opts = {};
      if (filter) {
        opts.filter = new RegExp(filter, 'i');
      }

      FunkyTests.runAll(opts).catch(function(error) {
        testsRunning = false; // Allow running again after error
        console.error('[Sandbox] Test run error:', error);
        sendToParent('error', { message: error.message || 'Test run failed' });
      });
    }

    /**
     * Handle messages from parent
     */
    window.addEventListener('message', function(event) {
      // Validate origin
      if (event.origin !== parentOrigin) {
        return;
      }

      var message;
      try {
        message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch (e) {
        return;
      }

      if (!message || !message.action) {
        return;
      }

      switch (message.action) {
        case 'loadTests':
          // Guard against duplicate load calls
          if (testsLoaded) {
            console.log('[Sandbox] Tests already loaded, ignoring duplicate');
            return;
          }
          testsLoaded = true;

          // Dev mode: load test files dynamically
          loadTestFiles(message.data.files).then(function() {
            setupReporter();

            // Small delay to ensure all synchronous describe/it calls have executed
            setTimeout(function() {
              // Get suites info and serialize (removes circular refs)
              var rawSuites = FunkyTests.getSuites ? FunkyTests.getSuites() : [];
              var suites = serializeSuites(rawSuites);
              sendToParent('ready', { suites: suites });
              updateStatus('Ready - ' + suites.length + ' test suites loaded');
            }, 50);
          });
          break;

        case 'runTests':
          // Guard against duplicate run calls
          if (testsRunning) {
            console.log('[Sandbox] Tests already running, ignoring duplicate');
            return;
          }
          testsRunning = true;

          runTests(message.data ? message.data.filter : null);
          break;

        case 'stopTests':
          if (typeof FunkyTests !== 'undefined' && FunkyTests.stop) {
            console.log('[Sandbox] Stopping tests...');
            FunkyTests.stop();
          }
          break;

        case 'ping':
          sendToParent('pong', {});
          break;
      }
    });

    // Signal that sandbox is ready to receive commands
    updateStatus('Sandbox ready, waiting for test files...');
    sendToParent('sandboxReady', {});

    /**
     * Global Escape handler to return focus to parent window
     */
    function setupEscapeToParent() {
      // Wait for Funky.Keyboard to be available
      if (typeof Funky === 'undefined' || !Funky.Keyboard) {
        setTimeout(setupEscapeToParent, 100);
        return;
      }

      Funky.Keyboard.register({
        key: 'escape',
        scope: 'global',
        priority: -200, // Very low priority - let component handlers run first
        preventDefault: false,
        handler: function(e) {
          if (e.defaultPrevented) {
            return;
          }

          // Use Funky APIs if available, fallback to DOM queries
          var hasOpenModal = (Funky.Modal && Funky.Modal.hasOpenModals && Funky.Modal.hasOpenModals()) ||
                             document.querySelector('.modal.show, .modal[aria-hidden="false"]');
          var hasOpenPopover = document.querySelector('.popover.show, [data-popover-open="true"]');
          var hasOpenDropdown = Funky.Keyboard.hasScope('combobox') ||
                                document.querySelector('.dropdown-menu.show, .combobox.is-open');
          var hasOpenCommandPalette = (Funky.CommandPalette && Funky.CommandPalette.isOpen && Funky.CommandPalette.isOpen()) ||
                                      document.querySelector('.command-palette.show, .command-palette--open');

          if (hasOpenModal || hasOpenPopover || hasOpenDropdown || hasOpenCommandPalette) {
            return;
          }

          console.log('[Sandbox] Escape pressed - returning focus to parent');
          sendToParent('focusParent', {});

          if (document.activeElement && document.activeElement !== document.body) {
            document.activeElement.blur();
          }
        },
        description: 'Return focus to parent window',
        group: 'Navigation'
      });

      console.log('[Sandbox] Escape-to-parent handler registered');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupEscapeToParent);
    } else {
      setupEscapeToParent();
    }

    /**
     * Auto-run tests when ?autorun=1 is in URL
     */
    (function() {
      var params = new URLSearchParams(window.location.search);

      if (params.get('autorun') !== '1') {
        return;
      }

      var filter = params.get('filter');

      window.addEventListener('load', function() {
        setTimeout(function() {
          if (typeof FunkyTests === 'undefined') {
            console.error('[Autorun] FunkyTests not available');
            return;
          }

          var testFiles = (window.TEST_FILES || []).map(function(entry) {
            return typeof entry === 'string' ? entry : entry.file;
          });

          if (testFiles.length === 0) {
            console.error('[Autorun] No test files found in TEST_FILES manifest');
            return;
          }

          console.log('[Autorun] Loading ' + testFiles.length + ' test files...');

          loadTestFiles(testFiles).then(function() {
            setupReporter();

            setTimeout(function() {
              updateStatus('Auto-running tests...');

              var opts = {};
              if (filter) {
                opts.filter = new RegExp(filter, 'i');
              }

              FunkyTests.runAll(opts).then(function() {
                updateStatus('Tests complete');
              }).catch(function(error) {
                console.error('[Autorun] Test error:', error);
              });
            }, 100);
          });
        }, 200);
      });
    })();

  })();
  </script>
