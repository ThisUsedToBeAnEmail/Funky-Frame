          var _sidenav = null;

          var _pubsubUnsubscribes = [];

          function initDocs(state) {
            state = state || {};

            // Initialize sidenav
            _sidenav = new Funky.SideNav('#docsSideNav', {
              items: DOC_CATEGORIES,
              searchable: true,
              searchPlaceholder: 'Search docs...',
              collapsible: true,
              fuzzySearch: true,
              rememberState: true,
              storageKey: 'funky_docs_nav_state',
              onChange: function(item) {
                if (item && item.url) {
                  loadDoc(item.url, item.id, item.label);
                }
              }
            });

            // Toggle button handler
            var toggleBtn = document.getElementById('docsSidebarToggle');
            var sidebar = document.getElementById('docsSidebar');
            var container = document.querySelector('.docs-container');
            var overlay = document.getElementById('docsOverlay');

            if (toggleBtn) {
              toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                container.classList.toggle('sidebar-collapsed');
                var isCollapsed = sidebar.classList.contains('collapsed');
                toggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
              });
            }

            // Overlay click closes sidebar on mobile
            if (overlay) {
              overlay.addEventListener('click', function() {
                sidebar.classList.add('collapsed');
                container.classList.add('sidebar-collapsed');
              });
            }

            // Keyboard shortcut for toggle (Cmd/Ctrl + \)
            if (Funky.Keyboard) {
              Funky.Keyboard.register({
                key: '\\',
                mod: true,
                description: 'Toggle documentation sidebar',
                group: 'Documentation',
                handler: function() {
                  toggleBtn.click();
                }
              });
            }

            // Load doc from: 1) SPA state, 2) URL hash, 3) localStorage
            var hash = window.location.hash.slice(1);
            var docToLoad = null;

            if (state.docId) {
              // Restore from SPA navigation state (highest priority)
              docToLoad = findItemById(state.docId);
            } else if (hash) {
              // Hash in URL
              docToLoad = findItemById(hash);
            } else {
              // Check for previously selected item from sidenav localStorage
              try {
                var savedNavState = localStorage.getItem('funky_docs_nav_state');
                if (savedNavState) {
                  var navState = JSON.parse(savedNavState);
                  if (navState.selected) {
                    docToLoad = findItemById(navState.selected);
                  }
                }
              } catch (e) {
                // Ignore localStorage errors
              }
            }

            if (docToLoad && docToLoad.url) {
              loadDoc(docToLoad.url, docToLoad.id, docToLoad.label);
              if (_sidenav) _sidenav.select(docToLoad.id, true);
            }

            // Set up internal doc link handler
            var markdownContainer = document.getElementById('markdownContainer');
            if (markdownContainer) {
              setupDocLinkHandler(markdownContainer);
            }

            console.log('[Docs] Page initialized with', DOC_CATEGORIES.length, 'categories');
          }

          function findItemById(id) {
            for (var i = 0; i < DOC_CATEGORIES.length; i++) {
              var cat = DOC_CATEGORIES[i];
              if (cat.children) {
                for (var j = 0; j < cat.children.length; j++) {
                  if (cat.children[j].id === id) {
                    return cat.children[j];
                  }
                }
              }
            }
            return null;
          }

          function findItemByPath(path) {
            // Normalize the path - extract just the relative part
            var cleanPath = path
              .replace(/^(\.\.\/)+/, '')  // Remove leading ../
              .replace(/^\.\//, '')        // Remove leading ./
              .replace(/^\/md\//, '')      // Remove /md/ prefix
              .replace(/^\//, '');         // Remove leading /

            for (var i = 0; i < DOC_CATEGORIES.length; i++) {
              var cat = DOC_CATEGORIES[i];
              if (cat.children) {
                for (var j = 0; j < cat.children.length; j++) {
                  var item = cat.children[j];
                  if (item.url) {
                    var itemPath = item.url.replace(/^\/md\//, '');
                    if (itemPath === cleanPath || item.url.indexOf(cleanPath) !== -1) {
                      return item;
                    }
                  }
                }
              }
            }
            return null;
          }

          function setupDocLinkHandler(container) {
            container.addEventListener('click', function(e) {
              var link = e.target.closest('a[href]');
              if (!link) return;

              var href = link.getAttribute('href');
              if (!href) return;

              // Skip external links, anchors, and non-md links
              if (href.indexOf('://') !== -1 || href.indexOf('mailto:') === 0) {
                return;
              }
              if (href.charAt(0) === '#') {
                return;
              }
              if (href.indexOf('.md') === -1) {
                return;
              }

              // Intercept internal markdown links
              e.preventDefault();
              e.stopPropagation();

              var item = findItemByPath(href);
              if (item && item.url) {
                loadDoc(item.url, item.id, item.label);
                if (_sidenav) _sidenav.select(item.id, true);
              } else {
                console.warn('[Docs] Could not find doc for link:', href);
                if (Funky.Toast) {
                  Funky.Toast.warning('Document not found: ' + href);
                }
              }
            });
          }

          function loadDoc(url, docId, title) {
            if (_currentDoc === url) return;
            _currentDoc = url;

            var container = document.getElementById('markdownContainer');
            var contentArea = document.getElementById('docsContent');

            // Update URL hash
            if (docId) {
              history.replaceState(null, '', '#' + docId);
            }

            // Update page title
            if (title) {
              var pageTitle = document.querySelector('.page-title');
              if (pageTitle) {
                pageTitle.textContent = title;
              }
              document.title = 'Funky Frame - ' + title;
            }

            // Show loading state
            contentArea.classList.add('loading');

            // Load and render markdown
            Funky.Markdown.renderFile(url, container, {
              // Syntax highlighting
              highlightCode: true,
              copyButton: true,

              // Headings
              headingIds: true,
              headingAnchors: true,

              // TOC Panel (slide-out with TreeView)
              tocPanel: true,
              tocPanelPosition: 'top-right',
              tocPanelSticky: true,
              tocMaxLevel: 3,

              // Tables (uses Funky.Table if available)
              tables: true,

              // Navigation
              keyboard: true,
              scrollTracking: true,
              announcements: true,

              // Caching
              cache: true,

              onLoad: function() {
                contentArea.classList.remove('loading');
                // Scroll content area to top
                window.scrollTo(0, 0);
              },
              onError: function(error) {
                contentArea.classList.remove('loading');
                container.innerHTML = '<div class="docs-empty-state">' +
                  '<i class="fas fa-exclamation-triangle"></i>' +
                  '<h3>Error Loading Document</h3>' +
                  '<p>' + error.message + '</p>' +
                  '</div>';
              }
            });
          }

          function destroyDocs() {
            // Cleanup PubSub subscriptions
            _pubsubUnsubscribes.forEach(function(unsub) {
              if (typeof unsub === 'function') unsub();
            });
            _pubsubUnsubscribes = [];

            // Capture state before destroying
            var savedDocUrl = _currentDoc;
            var savedDocId = window.location.hash.slice(1) || null;

            // Destroy sidenav
            if (_sidenav && _sidenav.destroy) {
              _sidenav.destroy();
            }
            _sidenav = null;
            _currentDoc = null;

            return { docUrl: savedDocUrl, docId: savedDocId };
          }

          // Page lifecycle
          if (typeof Funky !== 'undefined' && Funky.Pages) {
            Funky.Pages.register('docs', {
              init: function(state) {
                initDocs(state);
              },
              destroy: function() {
                var state = destroyDocs();
                console.log('[Docs] Page destroyed, state:', state);
                return state;
              }
            });
          } else {
            // Direct page load
            if (document.readyState !== 'loading') {
              initDocs();
            } else {
              document.addEventListener('DOMContentLoaded', initDocs);
            }
          }
        })();
      </script>
    </main>
